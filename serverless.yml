service: starwars-api

frameworkVersion: '3'

useDotenv: true
provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-1
  stage: dev
  memorySize: 250
  environment:
    DYNAMO_DB_TABLE: ${env:DYNAMO_DB_TABLE}
    API_URL_BASE: ${env:API_URL_BASE}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: 'dynamodb:*'
          Resource: '*'

custom:
  logRetentionInDays: 14  
  stage: ${opt:stage, self:provider.stage}
  dotenv:
    enabled: true
    path: .env

plugins:
 - serverless-plugin-typescript
 - serverless-offline
 - serverless-plugin-log-retention  

package:
  patterns:
    - '!node_modules/**'
    - 'package.json'
  individually: true

functions:
  api:
    handler: src/serverlesDeploy/http/lambda.handler
    timeout: 30
    events:
      - http:
          path: /starwars/films/{id}
          method: GET
          cors:
            origin: '*'
      - http:
          path: /starwars/films
          method: GET
          cors:
            origin: '*'   
      - http:
          path: /starwars/films
          method: POST
          cors:
            origin: '*'
# LAMBDA - starwars-api-dev-api
